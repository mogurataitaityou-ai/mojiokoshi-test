<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字起こし 技術検証</title>
<script src="https://cdn.jsdelivr.net/npm/eruda@3.4.3/eruda.min.js"></script>
<script>eruda.init();</script>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; margin: 16px; max-width: 900px; background:#fff; color:#222; }
  h1 { font-size: 20px; }
  fieldset { margin: 12px 0; border-radius: 8px; }
  label { display:inline-block; margin: 4px 12px 4px 0; }
  button { font-size: 18px; padding: 10px 18px; margin: 6px 6px 6px 0; border-radius: 8px; }
  #log { white-space: pre-wrap; background:#f4f4f4; padding:8px; font-size:13px; max-height: 260px; overflow:auto; }
  #out { white-space: pre-wrap; border:1px solid #ccc; padding:8px; min-height: 120px; font-size: 15px; }
  progress { width: 100%; height: 20px; }
</style>
</head>
<body>
<h1>文字起こし 技術検証ページ</h1>
<div id="env"></div>

<fieldset>
  <legend>1. 動画/音声ファイル</legend>
  <input type="file" id="file" accept="video/*,audio/*">
</fieldset>

<fieldset>
  <legend>2. 設定</legend>
  <label>モデル
    <select id="model">
      <option value="onnx-community/whisper-tiny">tiny（最軽量）</option>
      <option value="onnx-community/whisper-base" selected>base（軽量）</option>
      <option value="onnx-community/whisper-small">small（高精度・重い）</option>
    </select>
  </label>
  <label>処理方式
    <select id="device">
      <option value="webgpu">高速（WebGPU）</option>
      <option value="wasm">省メモリ（WASM）</option>
    </select>
  </label>
  <label>処理範囲
    <select id="limit">
      <option value="30">最初の30秒（ベンチマーク）</option>
      <option value="300">最初の5分</option>
      <option value="0">全部</option>
    </select>
  </label>
</fieldset>

<button id="run">▶ 文字起こし開始</button>
<button id="dl" disabled>SRTを保存</button>
<progress id="prog" value="0" max="1"></progress>

<h3>結果</h3>
<div id="out"></div>
<h3>ログ（この内容をコピーして送ってください）</h3>
<div id="log"></div>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';
env.allowLocalModels = false;

const $ = id => document.getElementById(id);
const logEl = $('log');
const log = (...a) => { const s = a.join(' '); logEl.textContent += s + '\n'; logEl.scrollTop = 1e9; console.log(s); };

$('env').textContent = `UA: ${navigator.userAgent} / WebGPU: ${'gpu' in navigator ? 'あり' : 'なし'} / CPUコア: ${navigator.hardwareConcurrency} / crossOriginIsolated: ${self.crossOriginIsolated}`;
log($('env').textContent);

const SR = 16000;
const CHUNK = 30; // 秒
let segments = [];
let asr = null, asrKey = '';

async function decodeAudio(file) {
  const t0 = performance.now();
  const buf = await file.arrayBuffer();
  log(`ファイル読込: ${(buf.byteLength/1e6).toFixed(1)}MB`);
  const ctx = new AudioContext({ sampleRate: SR });
  const ab = await ctx.decodeAudioData(buf);
  ctx.close();
  // モノラル化
  let mono = ab.getChannelData(0);
  if (ab.numberOfChannels > 1) {
    const r = ab.getChannelData(1);
    const m = new Float32Array(mono.length);
    for (let i = 0; i < m.length; i++) m[i] = (mono[i] + r[i]) / 2;
    mono = m;
  }
  log(`音声デコード: ${ab.duration.toFixed(1)}秒, ${ab.numberOfChannels}ch, ${((performance.now()-t0)/1000).toFixed(1)}s`);
  return mono;
}

async function getAsr(model, device) {
  const key = model + device;
  if (asr && asrKey === key) return asr;
  if (asr) { await asr.dispose?.(); asr = null; }
  const t0 = performance.now();
  const dtype = device === 'webgpu'
    ? { encoder_model: 'fp32', decoder_model_merged: 'q4' }
    : 'q8';
  log(`モデル読込開始: ${model} / ${device} / ${JSON.stringify(dtype)}`);
  asr = await pipeline('automatic-speech-recognition', model, {
    device, dtype,
    progress_callback: p => { if (p.status === 'progress' && p.total) { $('prog').value = p.loaded / p.total; } },
  });
  asrKey = key;
  log(`モデル読込完了: ${((performance.now()-t0)/1000).toFixed(1)}s`);
  return asr;
}

const fmt = s => {
  const ms = Math.round(s * 1000);
  const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, sec = Math.floor(ms / 1000) % 60, r = ms % 1000;
  const p = (n, w = 2) => String(n).padStart(w, '0');
  return `${p(h)}:${p(m)}:${p(sec)},${p(r, 3)}`;
};
const toSrt = segs => segs.map((s, i) => `${i+1}\n${fmt(s.start)} --> ${fmt(s.end)}\n${s.text.trim()}\n`).join('\n');

$('run').onclick = async () => {
  const file = $('file').files[0];
  if (!file) { alert('ファイルを選んでください'); return; }
  $('run').disabled = true; $('dl').disabled = true;
  segments = []; $('out').textContent = '';
  let wakeLock = null;
  try { wakeLock = await navigator.wakeLock?.request('screen'); log('画面スリープ防止: ON'); } catch (e) { log('画面スリープ防止: 失敗 ' + e.message); }
  try {
    let audio = await decodeAudio(file);
    const limit = +$('limit').value;
    if (limit) audio = audio.subarray(0, limit * SR);
    const dur = audio.length / SR;
    const p = await getAsr($('model').value, $('device').value);
    const t0 = performance.now();
    const n = Math.ceil(audio.length / (CHUNK * SR));
    for (let i = 0; i < n; i++) {
      const off = i * CHUNK;
      const piece = audio.subarray(off * SR, Math.min(audio.length, (off + CHUNK) * SR));
      const tc = performance.now();
      const r = await p(piece, { language: 'japanese', task: 'transcribe', return_timestamps: true });
      for (const c of (r.chunks || [{ timestamp: [0, piece.length / SR], text: r.text }])) {
        const st = off + (c.timestamp[0] ?? 0);
        const en = off + (c.timestamp[1] ?? piece.length / SR);
        segments.push({ start: st, end: en, text: c.text });
        $('out').textContent += `[${fmt(st)}] ${c.text}\n`;
      }
      $('prog').value = (i + 1) / n;
      log(`区間 ${i+1}/${n}: ${((performance.now()-tc)/1000).toFixed(1)}s`);
    }
    const sec = (performance.now() - t0) / 1000;
    log(`完了: 音声${dur.toFixed(0)}秒 を ${sec.toFixed(1)}秒で処理 → 実時間比 ${(sec/dur).toFixed(2)}倍（20分動画なら約${(sec/dur*20).toFixed(1)}分）`);
    $('dl').disabled = false;
  } catch (e) {
    log('エラー: ' + (e.stack || e));
  } finally {
    wakeLock?.release?.();
    $('run').disabled = false;
  }
};

$('dl').onclick = () => {
  const blob = new Blob([toSrt(segments)], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'subtitle.srt';
  a.click();
};
</script>
</body>
</html>
